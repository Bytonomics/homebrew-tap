fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: local
    hooks:
      - id: render-formula
        name: regenerate formula from template
        entry: make render
        language: system
        pass_filenames: false
        always_run: true
      - id: check-formula-freshness
        name: check formula matches template
        entry: .github/scripts/check-formula-freshness.sh
        language: script
        pass_filenames: false
        always_run: true
      - id: make-check
        name: make check
        entry: make check
        language: system
        pass_filenames: false
        always_run: true
